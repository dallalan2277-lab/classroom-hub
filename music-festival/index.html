<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#fbf7ef">
  <meta name="description" content="국내 사시사철 음악 축제와 세계 유명 음악 축제를 듣고 나만의 축제 초대장을 만드는 중학교 음악 수업 화면과 학습지.">
  <title>사시사철 음악 축제</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css?v=3">
  <!-- 학습지 허브: 학번·이름, 자리 비움 감지, 보내기, ?교사 모드. 다른 코드보다 먼저 실행되어야 해요 -->
  <script src="../classroom.js" data-ws="music-festival" data-title="사시사철 음악 축제"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="content.js?v=3" defer></script>
  <script src="app.js?v=3" defer></script>
  <script src="../qr-dock.js?v=1" data-url="https://dallalan2277-lab.github.io/classroom-hub/music-festival/" data-title="사시사철 음악 축제" data-theme="light" defer></script>
</head>
<body>
  <a class="skip" href="#view">본문으로 바로가기</a>
  <aside id="side" aria-label="수업 목차">
    <div class="side-head">
      <a class="brand" href="#start"><small>중학교 음악</small><b>사시사철 음악 축제</b></a>
      <button type="button" class="side-toggle" id="btnCollapse" aria-label="목차 접기" title="목차 접기">접기</button>
    </div>
    <nav id="nav" aria-label="수업 순서"></nav>
    <div class="side-prog" id="sideProg" aria-live="polite"></div>
    <div class="tools">
      <button type="button" class="mini cls" id="btnClass">수업 모드 켜기</button>
      <div class="row">
        <button type="button" class="mini" id="btnSmall" aria-label="글자 작게">가−</button>
        <button type="button" class="mini" id="btnBig" aria-label="글자 크게">가+</button>
        <button type="button" class="mini" id="btnFull">전체 화면</button>
      </div>
    </div>
  </aside>
  <button type="button" id="burger" aria-controls="side" aria-expanded="false">목차</button>
  <div id="scrim" hidden></div>
  <main>
    <div id="view" tabindex="-1"></div>
    <footer class="pager">
      <div class="pager-prompt" id="pagerPrompt" role="region" aria-label="남은 문항 안내" hidden></div>
      <button type="button" id="prev"><small>이전</small><b></b></button>
      <div class="where">
        <button type="button" id="pgDo" class="pg-do"></button>
        <em id="where" hidden></em>
        <span class="pg"><i id="pgBar"></i></span>
      </div>
      <button type="button" id="next"><small>다음</small><b></b></button>
    </footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">이 수업 화면과 학습지를 쓰려면 브라우저의 JavaScript를 켜 주세요.</p></noscript>
</body>
</html>
