<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14110e">
  <meta name="description" content="판소리와 창극을 감상하고 비교하는 중학교 음악 수업 화면과 학습지(개선판).">
  <title>판소리와 창극 · 수업과 학습지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css?v=q5">
  <!-- 학습지 허브: 학번·이름, 자리 비움 감지, 보내기, ?교사 모드. 다른 코드보다 먼저 실행되어야 해요 -->
  <script src="../classroom.js" data-ws="pansori-plus" data-title="판소리와 창극 · 수업과 학습지(개선판)"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="content.js?v=q5" defer></script>
  <script src="app.js?v=q5" defer></script>
  <script src="../qr-dock.js?v=1" data-url="https://dallalan2277-lab.github.io/classroom-hub/pansori-plus/" data-title="판소리와 창극" defer></script>
</head>
<body>
  <a class="skip" href="#view">본문으로 바로가기</a>
  <aside id="side" aria-label="수업 목차">
    <a class="brand" href="#start"><small>중학교 음악 · 우리 음악극</small><b>판소리와 창극</b></a>
    <nav id="nav" aria-label="수업 순서"></nav>
    <div class="tools">
      <button type="button" class="mini cls" id="btnClass">수업 모드 켜기</button>
      <div class="row">
        <button type="button" class="mini" id="btnSmall" aria-label="글자 작게">가−</button>
        <button type="button" class="mini" id="btnBig" aria-label="글자 크게">가+</button>
        <button type="button" class="mini" id="btnFull">전체 화면</button>
      </div>
    </div>
  </aside>
  <button type="button" id="burger" aria-controls="side" aria-expanded="false">목차</button>
  <div id="scrim" hidden></div>
  <main>
    <div id="view" tabindex="-1"></div>
    <footer class="pager">
      <button type="button" id="prev"><small>이전</small><b></b></button>
      <div class="where"><span class="pg"><i id="pgBar"></i></span><em id="where"></em></div>
      <button type="button" id="next"><small>다음</small><b></b></button>
    </footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">이 수업 화면과 학습지를 쓰려면 브라우저의 JavaScript를 켜 주세요.</p></noscript>
</body>
</html>
