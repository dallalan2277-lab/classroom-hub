<section class="w-part" data-part="음악극의 탄생">
    <div class="w-part-head"><span class="w-no">01</span><h2>음악극의 탄생</h2><span class="w-meta">영상으로 생각 열기 · 5분</span></div>
    <p>서로 다른 나라의 공연 영상 세 편을 보고, 무엇이 같은지 찾아봅시다. 영상은 이 화면 안에서 재생됩니다.</p>
    <div class="w-videos">
      <figure class="w-vid" data-yt="3P1CnWI62Ik">
        <button class="w-vid-play" type="button" aria-label="영상 1 재생"><img alt="" loading="lazy" src="https://i.ytimg.com/vi/3P1CnWI62Ik/hqdefault.jpg"><span>▶ 재생</span></button>
        <figcaption><b>영상 1</b> 한국 · 서울 곳곳에서 펼쳐진 노래와 춤</figcaption>
      </figure>
      <figure class="w-vid" data-yt="Ds8ryWd5aFw">
        <button class="w-vid-play" type="button" aria-label="영상 2 재생"><img alt="" loading="lazy" src="https://i.ytimg.com/vi/Ds8ryWd5aFw/hqdefault.jpg"><span>▶ 재생</span></button>
        <figcaption><b>영상 2</b> 스페인 · 발렌시아 시장에 갑자기 울린 노래</figcaption>
      </figure>
      <figure class="w-vid" data-yt="ewOAsUWQJvo">
        <button class="w-vid-play" type="button" aria-label="영상 3 재생"><img alt="" loading="lazy" src="https://i.ytimg.com/vi/ewOAsUWQJvo/hqdefault.jpg"><span>▶ 재생</span></button>
        <figcaption><b>영상 3</b> 네덜란드 · 동물로 변신한 배우들의 무대</figcaption>
      </figure>
    </div>
    <h3>세 영상의 공통점 찾기</h3>
    <p>세 영상에 <b>모두</b> 들어 있던 것을 골라 봅시다. (여러 개 고르기)</p>
    <div class="w-checks" data-label="세 영상에 모두 있던 것" data-opts="노래|악기 연주|춤·몸짓|의상·분장|등장인물과 상황(이야기)|관객"></div>
    <h3>어떤 음악극일까?</h3>
    <p>오늘 배울 장르 중 어디에 속할지 짐작해 봅시다. 수업이 끝난 뒤 제출 전에 다시 고쳐도 됩니다.</p>
    <div>
      <div class="w-pick-row"><span class="w-q">영상 1 · 서울</span><select class="w-pick" data-a="판소리" data-opts="뮤지컬|오페라|판소리"></select></div>
      <div class="w-pick-row"><span class="w-q">영상 2 · 발렌시아 시장</span><select class="w-pick" data-a="오페라" data-opts="뮤지컬|오페라|판소리"></select></div>
      <div class="w-pick-row"><span class="w-q">영상 3 · 동물로 변신한 배우들</span><select class="w-pick" data-a="뮤지컬" data-opts="뮤지컬|오페라|판소리"></select></div>
    </div>
    <p class="w-remember">음악극은 <span class="w-bk" data-a="음악|노래"></span>과 <span class="w-bk" data-a="극|이야기|연극|연기"></span>이 하나로 어우러진 공연이다. 나라마다 서로 다른 모습으로 발전했다.</p>
  </section>

  <section class="w-part" data-part="뮤지컬">
    <div class="w-part-head"><span class="w-no">02</span><h2>뮤지컬</h2><span class="w-meta">영국·미국 등 · 6분</span></div>
    <h3>유래와 특징</h3>
    <ol class="w-items">
      <li>1800년대 <span class="w-bk" data-a="영국|미국"></span>·<span class="w-bk" data-a="미국|영국"></span>의 대중 공연은 희극, 노래, 춤 등 여러 요소를 결합했다.</li>
      <li>뮤지컬의 노래는 배경음악에 머물지 않고 인물의 선택·감정·<span class="w-bk" data-a="갈등"></span>을 전달한다.</li>
      <li>뮤지컬은 보통 <span class="w-bk" data-a="마이크"></span>로 목소리를 확성한다.</li>
    </ol>
    <h3>핵심 용어</h3>
    <div class="w-terms">
      <div class="w-term"><span class="w-bk" data-a="넘버"></span><p>뮤지컬을 이루는 개별 노래나 음악 장면</p><p class="w-ex">예) 「사운드 오브 뮤직」의 ‘도레미 송’</p></div>
      <div class="w-term"><span class="w-bk" data-a="북|book|북(book)"></span><p>줄거리·장면 구성·대사 등 뮤지컬의 극적 바탕이 되는 대본</p><p class="w-ex">이야기의 설계도</p></div>
      <div class="w-term"><span class="w-bk" data-a="송스루|sungthrough|성스루"></span><p>말하는 대사를 거의 쓰지 않고 대화와 사건도 대부분 음악으로 이어 가는 형식</p><p class="w-ex">예) 「레 미제라블」 장발장과 자베르의 대립 장면</p></div>
      <div class="w-term"><span class="w-bk" data-a="앙상블"></span><p>여러 배우가 함께 노래하고 움직이는 장면이나 그 출연진</p></div>
    </div>
  </section>

  <section class="w-part" data-part="오페라">
    <div class="w-part-head"><span class="w-no">03</span><h2>오페라</h2><span class="w-meta">이탈리아 · 10분</span></div>
    <h3>유래와 특징</h3>
    <ol class="w-items">
      <li>1500년대 말 이탈리아 <span class="w-bk" data-a="피렌체|플로렌스"></span>의 예술가들은 고대 <span class="w-bk" data-a="그리스비극|그리스"></span>을 되살리려 했다.</li>
      <li>대사에 선율을 붙이는 실험을 하면서 약 <span class="w-bk" data-a="1600|1600년|1600년경"></span>년경 오페라가 탄생했다.</li>
      <li>성악 발성으로 노래하며 전통적으로 확성용 <span class="w-bk" data-a="마이크"></span> 없이 객석에 소리를 전달한다.</li>
      <li><span class="w-bk" data-a="오케스트라|관현악단"></span>는 반주뿐 아니라 분위기를 만들고 인물의 감정과 사건의 변화를 음악으로 표현한다.</li>
      <li>혼자 부르는 <span class="w-bk" data-a="독창"></span>, 몇 사람이 각자 다른 성부를 부르는 <span class="w-bk" data-a="중창"></span>, 여럿이 함께 부르는 합창 등 여러 형식을 사용한다.</li>
    </ol>
    <h3>노래 형식</h3>
    <div class="w-terms">
      <div class="w-term"><span class="w-bk" data-a="서곡"></span><p>막이 오르기 전이나 작품이 시작될 때 악기로 연주하는 곡</p><p class="w-ex">사람이 부르는 노래가 아닌 기악곡</p></div>
      <div class="w-term"><span class="w-bk" data-a="아리아"></span><p>한 인물이 자신의 감정이나 생각을 선율을 갖추어 표현하는 독창곡</p><p class="w-ex">예) 「마술피리」 밤의 여왕 아리아</p></div>
      <div class="w-term"><span class="w-bk" data-a="레치타티보"></span><p>말의 억양과 리듬을 살려 대화하듯 부르는 노래. 사건을 진행할 때 자주 쓰인다</p><p class="w-ex">예) 「피가로의 결혼」 수잔나와 피가로의 대화</p></div>
    </div>
    <p class="w-remember">「마술피리」의 말하는 대사는 레치타티보가 아니다. 말하는 대사와 노래가 번갈아 나오는 <span class="w-bk" data-a="징슈필"></span> 형식의 오페라이다.</p>
    <h3>성부</h3>
    <div class="w-tbl">
      <table class="w-voice">
        <tr><th></th><th>높은 성부</th><th>중간 성부</th><th>낮은 성부</th></tr>
        <tr><th>여성</th><td><span class="w-bk" data-a="소프라노"></span></td><td>(메조소프라노)</td><td><span class="w-bk" data-a="알토|콘트랄토"></span></td></tr>
        <tr><th>남성</th><td><span class="w-bk" data-a="테너"></span></td><td><span class="w-bk" data-a="바리톤"></span></td><td><span class="w-bk" data-a="베이스"></span></td></tr>
      </table>
    </div>
    <ol class="w-items">
      <li>오페라에서 낮은 여성 목소리의 종류는 보통 <span class="w-bk" data-a="콘트랄토"></span>라고 부른다.</li>
      <li>「마술피리」의 밤의 여왕은 <span class="w-bk" data-a="소프라노"></span>가 맡는 배역이다.</li>
      <li>성부를 구별할 때는 편하게 노래하는 <span class="w-bk" data-a="음역"></span>과 목소리의 <span class="w-bk" data-a="음색"></span>을 함께 살핀다.</li>
    </ol>
  </section>

  <section class="w-part" data-part="경극">
    <div class="w-part-head"><span class="w-no">04</span><h2>경극</h2><span class="w-meta">중국 · 6분</span></div>
    <ol class="w-items">
      <li>1700년대 말 여러 지역의 극단이 <span class="w-bk" data-a="베이징|북경"></span>에 모이면서 경극이 발전했다.</li>
      <li>경극의 네 가지 주요 표현 ‘창·념·작·타’에서 창은 <span class="w-bk" data-a="노래"></span>, 념은 <span class="w-bk" data-a="대사|말"></span>, 작은 <span class="w-bk" data-a="연기"></span>, 타는 <span class="w-bk" data-a="무술|곡예|무술과곡예"></span>이다.</li>
      <li>대표적인 배역 분류 <span class="w-bk" data-a="생단정축"></span>에서 단은 <span class="w-bk" data-a="여성|여자"></span> 인물, 축은 익살스러운 배역이다.</li>
    </ol>
    <div class="w-terms">
      <div class="w-term"><span class="w-bk" data-a="검보"></span><p>인물의 성격과 배역을 나타내도록 얼굴에 그리는 분장 무늬</p></div>
      <div class="w-term"><span class="w-bk" data-a="경호|징후"></span><p>활로 줄을 켜는 두 줄 찰현악기. 높고 날카로운 소리로 노래 선율을 돕는다</p></div>
      <div class="w-term"><span class="w-bk" data-a="양식화된동작|양식화된|양식화"></span><p>실제 행동을 무대의 약속에 맞게 다듬어 보여 주는 표현. 손짓으로 문 열기, 채찍으로 말타기</p></div>
    </div>
  </section>

  <section class="w-part" data-part="가부키">
    <div class="w-part-head"><span class="w-no">05</span><h2>가부키</h2><span class="w-meta">일본 · 6분</span></div>
    <ol class="w-items">
      <li>1600년대 초 일본에서 <span class="w-bk" data-a="오쿠니|이즈모노오쿠니"></span>의 춤 공연을 계기로 시작했다.</li>
      <li>오늘날 전통 가부키에서는 <span class="w-bk" data-a="남성|남자"></span> 배우가 여성 배역도 연기한다.</li>
    </ol>
    <div class="w-terms">
      <div class="w-term"><span class="w-bk" data-a="미에"></span><p>감정이 고조되는 순간 특징적인 자세로 잠시 멈추는 연기</p><p class="w-ex">연기 방식</p></div>
      <div class="w-term"><span class="w-bk" data-a="구마도리"></span><p>얼굴에 굵은 선과 색을 그려 인물의 성격과 힘을 강조하는 분장</p><p class="w-ex">분장</p></div>
      <div class="w-term"><span class="w-bk" data-a="하나미치"></span><p>본무대에서 객석 사이로 길게 뻗은 통로형 무대</p><p class="w-ex">무대 공간</p></div>
      <div class="w-term"><span class="w-bk" data-a="샤미센"></span><p>세 줄을 뜯어 연주하는 일본의 현악기</p><p class="w-ex">악기</p></div>
      <div class="w-term"><span class="w-bk" data-a="온나가타"></span><p>여성 배역을 전문적으로 연기하는 남성 배우</p><p class="w-ex">배역</p></div>
    </div>
  </section>

  <section class="w-part" data-part="판소리">
    <div class="w-part-head"><span class="w-no">06</span><h2>판소리</h2><span class="w-meta">한국 · 6분</span></div>
    <ol class="w-items">
      <li>판소리는 조선 <span class="w-bk" data-a="후기"></span>에 성장한 우리 전통 공연 예술이다.</li>
      <li><span class="w-bk" data-a="소리꾼"></span> 한 명이 해설자가 되기도 하고 여러 인물을 연기하는 1인 음악극이다.</li>
      <li>남아 전하는 다섯 바탕: 춘향가, 심청가, <span class="w-bk" data-a="흥보가|흥부가"></span>, 수궁가, 적벽가</li>
    </ol>
    <div class="w-terms">
      <div class="w-term"><span class="w-bk" data-a="창|소리|창(소리)"></span><p>장단에 선율을 얹어 부르는 노래 부분</p></div>
