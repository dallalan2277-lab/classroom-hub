<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학습지 모음</title>
<style>
:root{--bg:#f5f6f3;--card:#fff;--ink:#1f2a24;--muted:#5d6a63;--line:#dde3de;--accent:#244b3a}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1d2420;--ink:#e8eee9;--muted:#a3b0a8;--line:#2e3833;--accent:#8fc5a8}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 16px}
h1{font-size:24px;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}a.card b{display:block;font-size:17px;margin-bottom:4px}a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>학습지 모음</h1>
  <p>선생님이 알려 준 학습지를 눌러 시작하세요.</p>
  <a class="card" href="gugak-plus/"><b>국악기 학습지 · 소리탐구실 (개선판)</b><span>교과서 22종(나발·나각 포함) 관찰 · 복습 14문항</span></a>
  <a class="card" href="stage-class/"><b>음악극 탐험대 · 수업과 학습지</b><span>장르 감상·용어·퀴즈 → 장마다 학습지 → 제출하기</span></a>
  <a class="card" href="dance-class/"><b>춤을 세계 음악 속으로 · 수업과 학습지</b><span>춤 감상 → 춤별 빈칸 → 종합 퀴즈 → 제출하기</span></a>
  <a class="card" href="pansori-class/"><b>판소리와 창극 · 수업과 학습지</b><span>소리판 → 다섯 마당과 장단 → 사랑가 두 무대 → 오늘의 판소리 → 제출하기</span></a>
</main>
</body>
</html>
