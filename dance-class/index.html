<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>춤을 세계 음악 속으로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100f17; --bg2:#17151f; --bg3:#201d2b; --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.22);
  --text:#f6f1e9; --muted:#bdb5c9; --dim:#8d859b; --acc:#e8b04a; --side:310px;
}
*{box-sizing:border-box}
html{font-size:var(--fs,20px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:'Gowun Batang',serif}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:6px}

/* ---------- shell ---------- */
#side{position:fixed;inset:0 auto 0 0;width:var(--side);background:#0b0a11;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .3s ease}
#side .brand{padding:1.2rem 1.2rem .9rem;border-bottom:1px solid var(--line)}
#side .brand small{display:block;color:var(--dim);font-size:.72rem;letter-spacing:.08em}
#side .brand b{font-family:'Gowun Batang',serif;font-size:1.25rem;line-height:1.3;display:block;margin-top:.15rem}
#nav{flex:1;overflow:auto;padding:.6rem .6rem 1rem}
#nav .grp{margin:.7rem .5rem .25rem;font-size:.7rem;letter-spacing:.12em;color:var(--dim);display:flex;align-items:center;gap:.5rem}
#nav .grp i{font-style:normal;color:var(--text);font-weight:900;font-size:.8rem}
#nav a{display:flex;align-items:center;gap:.6rem;padding:.36rem .7rem;border-radius:10px;text-decoration:none;color:var(--muted);font-size:.86rem;line-height:1.35}
#nav a:hover{background:rgba(255,255,255,.06);color:var(--text)}
#nav a.on{background:rgba(255,255,255,.1);color:var(--text);font-weight:700}
#nav a .dot{width:.6rem;height:.6rem;border-radius:50%;flex:none;background:var(--c,#888)}
#nav a.sub{padding-left:1.2rem}
#nav .lesson{margin:.5rem .7rem .1rem 1.2rem;font-size:.66rem;color:var(--dim);border-top:1px dashed var(--line);padding-top:.35rem}
#side .tools{border-top:1px solid var(--line);padding:.7rem .9rem .9rem;display:grid;gap:.45rem}
.tool-row{display:flex;gap:.4rem;align-items:center;font-size:.72rem;color:var(--dim)}
.tool-row span{flex:1}
.mini{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:.25rem .55rem;font-size:.72rem;color:var(--text)}
.mini.on{background:var(--text);color:#111;border-color:var(--text)}
#burger{display:none;position:fixed;top:.7rem;left:.7rem;z-index:40;border:1px solid var(--line2);background:#0b0a11;border-radius:10px;padding:.3rem .65rem;font-size:1rem}
body.side-closed #side{transform:translateX(-100%)}
body.side-closed main{margin-left:0}
body.side-closed #burger{display:block}
main{margin-left:var(--side);min-height:100vh;transition:margin .3s ease;display:flex;flex-direction:column}
#view{flex:1;width:100%}
.pager{position:sticky;bottom:0;display:flex;align-items:stretch;border-top:1px solid var(--line);background:rgba(16,15,23,.92);backdrop-filter:blur(10px);z-index:20}
.pager button{flex:1;background:none;border:0;padding:.75rem 1.2rem;text-align:left;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column}
.pager button:last-child{text-align:right;align-items:flex-end}
.pager button b{color:var(--text);font-size:1rem}
.pager button:hover b{color:var(--acc)}
.pager button:disabled{opacity:.25;cursor:default}
.pager .where{flex:none;display:flex;align-items:center;gap:.35rem;padding:0 1rem}
.pager .where i{width:.5rem;height:.5rem;border-radius:50%;background:var(--line2)}
.pager .where i.on{background:var(--acc);transform:scale(1.4)}

.wrap{max-width:1500px;margin:0 auto;padding:0 3.2rem}
section.blk{padding:3rem 0;border-top:1px solid var(--line)}
.eyebrow{font-size:.72rem;letter-spacing:.18em;color:var(--acc);font-weight:700;text-transform:uppercase}
h1,h2,h3{line-height:1.25;margin:0}
h2.sec{font-family:'Gowun Batang',serif;font-size:2.1rem;margin:.3rem 0 1.4rem}
.lead{font-size:1.2rem;color:var(--muted);max-width:52em}
.ask{border-left:6px solid var(--acc);background:linear-gradient(90deg,rgba(255,255,255,.06),transparent);padding:1rem 1.4rem;border-radius:0 14px 14px 0;font-size:1.15rem}
.ask b{display:block;font-size:.72rem;letter-spacing:.15em;color:var(--acc);margin-bottom:.2rem}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:99px;padding:.05rem .65rem;font-size:.72rem;color:var(--muted);margin:0 .3rem .3rem 0}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:99px;padding:.6rem 1.3rem;background:var(--acc);color:#14110c;font-weight:700;text-decoration:none;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn:hover{filter:brightness(1.1)}

/* ---------- home ---------- */
.home-hero{display:grid;grid-template-columns:1.05fr 1fr;gap:3rem;align-items:center;padding:3.5rem 0 3rem}
.home-hero h1{font-family:'Gowun Batang',serif;font-size:4.4rem;line-height:1.1;letter-spacing:-.02em}
.home-hero h1 em{font-style:normal;color:var(--acc)}
.mosaic{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:5.2rem;gap:.5rem}
.mosaic a{position:relative;border-radius:14px;overflow:hidden;text-decoration:none;display:block}
.mosaic a svg{position:absolute;inset:0;width:100%;height:100%}
.mosaic a span{position:absolute;left:.7rem;bottom:.45rem;font-weight:700;font-size:.85rem;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.mosaic a:hover svg{transform:scale(1.06);transition:transform .5s}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem}
.plan h3{font-family:'Gowun Batang',serif;font-size:1.5rem;margin-bottom:.8rem}
.plan h3 small{font-family:'Noto Sans KR';font-size:.75rem;color:var(--dim);margin-left:.5rem}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line2)}
.tl li{position:relative;padding:0 0 1rem 1.3rem}
.tl li::before{content:"";position:absolute;left:-.42rem;top:.55rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--bg);border:2px solid var(--acc)}
.tl li b{display:block}
.tl li .min{color:var(--acc);font-weight:700;font-size:.8rem}
.tl li a{color:var(--text)}
.goal{font-size:1.25rem;font-family:'Gowun Batang',serif;padding-left:1.2rem;border-left:4px solid var(--acc);margin:.5rem 0}
.howto{display:flex;flex-wrap:wrap;gap:1.6rem 3rem;color:var(--muted);font-size:.9rem}
.howto b{color:var(--text)}
kbd{border:1px solid var(--line2);border-bottom-width:3px;border-radius:6px;padding:0 .4rem;font-size:.8em;color:var(--text)}

/* ---------- map ---------- */
.map-wrap{position:relative;margin:1rem 0 0;background:radial-gradient(ellipse at 50% 40%,#1b2235 0%,#0f121c 70%);border-radius:24px;border:1px solid var(--line);overflow:hidden}
.map-wrap svg{display:block;width:100%;height:auto}
.land{fill:#2b3247;stroke:#3c4560;stroke-width:.6}
.sphere{fill:none;stroke:rgba(255,255,255,.08)}
.pin{cursor:pointer}
.pin .ring{fill:none;stroke:var(--c);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.pin .core{fill:var(--c);stroke:#0f121c;stroke-width:2}
.pin text{fill:#fff;font-size:15px;font-weight:700;paint-order:stroke;stroke:#0f121c;stroke-width:4px;stroke-linejoin:round}
.pin text.s{font-size:11px;font-weight:500;fill:#c9c3d6}
.pin:hover .core,.pin:focus .core{r:11}
.pin:focus{outline:none}
.pin:focus text{fill:var(--c)}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.map-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:1.6rem;border-top:1px solid var(--line)}
.map-legend .col{padding:1rem 1.2rem 0 0}
.map-legend h4{margin:0 0 .4rem;font-size:.75rem;letter-spacing:.14em;color:var(--dim)}
.map-legend a{display:flex;align-items:baseline;gap:.55rem;text-decoration:none;padding:.25rem 0;font-size:1.05rem}
.map-legend a i{width:.7rem;height:.7rem;border-radius:50%;background:var(--c);flex:none;transform:translateY(-.05rem)}
.map-legend a small{color:var(--dim);font-size:.75rem;margin-left:auto}
.map-legend a:hover b{color:var(--c)}

/* ---------- dance page ---------- */
.d-hero{position:relative;min-height:74vh;display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--line)}
.d-hero .art{position:absolute;inset:0}
.d-hero .art svg{width:100%;height:100%}
.d-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,9,15,.92) 0%,rgba(10,9,15,.7) 45%,rgba(10,9,15,.05) 100%),linear-gradient(0deg,rgba(10,9,15,.9),transparent 45%)}
.d-hero .inner{position:relative;z-index:2;padding:4rem 3.2rem 2.6rem;max-width:1500px;width:100%;margin:0 auto}
.d-hero .num{font-size:.8rem;letter-spacing:.2em;color:var(--acc);font-weight:700}
.d-hero h1{font-family:'Gowun Batang',serif;font-size:5.2rem;letter-spacing:-.02em;line-height:1.05;margin:.3rem 0 .2rem}
.d-hero .orig{font-size:1.1rem;color:var(--muted);font-style:italic}
.d-hero .tagline{font-size:1.45rem;max-width:30em;margin:1.1rem 0 1.8rem;font-family:'Gowun Batang',serif}
.facts{display:flex;flex-wrap:wrap;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);max-width:1100px}
.facts div{padding:.7rem 1.6rem .7rem 0;margin-right:1.6rem;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts small{display:block;font-size:.68rem;letter-spacing:.14em;color:var(--dim)}
.facts b{font-size:1.05rem}

.watch{display:grid;grid-template-columns:1.6fr 1fr;gap:2.4rem;align-items:start}
.points{counter-reset:p;list-style:none;margin:0;padding:0}
.points li{counter-increment:p;display:grid;grid-template-columns:2.6rem 1fr;gap:.6rem;padding:.75rem 0;border-bottom:1px solid var(--line);font-size:1.08rem}
.points li::before{content:counter(p);font-family:'Gowun Batang',serif;font-size:1.8rem;color:var(--acc);line-height:1}
.vid{margin:0}
.vid-frame{position:relative;display:block;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line);text-decoration:none}
.vid-frame .art,.vid-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid-frame .art svg{width:100%;height:100%}
.vid-frame img{z-index:1}
.vid-frame .shade{position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,.05) 55%)}
.vid-frame .play{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:5.2rem;height:5.2rem;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:transform .2s}
.vid-frame .play::after{content:"";border-left:1.5rem solid #111;border-top:.95rem solid transparent;border-bottom:.95rem solid transparent;margin-left:.35rem}
.vid-frame:hover .play{transform:translate(-50%,-50%) scale(1.08)}
.vid-frame .cap{position:absolute;z-index:3;left:1.2rem;right:1.2rem;bottom:.9rem;font-weight:700;font-size:1.05rem;line-height:1.4}
.vid-frame .cap small{display:block;font-weight:500;font-size:.72rem;color:#ddd}
.vid-frame .mode .ql{background:var(--acc);color:#111;border-radius:4px;padding:0 .3rem;margin-right:.4rem;font-weight:900}
.vid-frame .mode{position:absolute;z-index:3;top:.8rem;right:.8rem;background:rgba(0,0,0,.6);border-radius:99px;padding:.15rem .7rem;font-size:.7rem}
.vid-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid figcaption{display:flex;gap:1rem;justify-content:space-between;align-items:baseline;padding:.55rem .2rem 0;font-size:.78rem;color:var(--dim)}
.vid figcaption a{color:var(--muted);white-space:nowrap}
.vid.small .play{width:3.4rem;height:3.4rem}
.vid.small .play::after{border-left-width:1rem;border-top-width:.65rem;border-bottom-width:.65rem}
.vid.small .cap{font-size:.85rem}
.vid-side{display:grid;gap:1.4rem}
.vnote{font-size:.85rem;color:var(--muted);margin:.25rem 0 0}

.two{display:grid;grid-template-columns:1fr 1fr;gap:3.4rem}
.hist{list-style:none;margin:0;padding:0;position:relative}
.hist::before{content:"";position:absolute;left:6.8rem;top:.6rem;bottom:.6rem;width:2px;background:var(--line2)}
.hist li{display:grid;grid-template-columns:6.8rem 1fr;gap:1.4rem;padding:.55rem 0;position:relative}
.hist li .y{font-family:'Gowun Batang',serif;font-weight:700;color:var(--acc);text-align:right;padding-right:.4rem;font-size:1rem;line-height:1.5}
.hist li::after{content:"";position:absolute;left:calc(6.8rem - .38rem);top:1.05rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--bg);border:2px solid var(--acc)}
.culture p{font-size:1.06rem;margin:0 0 1rem}
.pull{font-family:'Gowun Batang',serif;font-size:1.55rem;line-height:1.5;border-top:2px solid var(--acc);padding-top:1rem;margin-top:1.4rem}

.inst{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));border-top:1px solid var(--line2)}
.inst div{padding:1rem 1.2rem 1rem 0;border-bottom:1px solid var(--line)}
.inst b{font-size:1.15rem;display:block}
.inst span{font-size:.92rem;color:var(--muted)}
.piece{display:flex;gap:1.4rem;align-items:baseline;margin:1.6rem 0 0;padding:1rem 1.4rem;background:var(--bg2);border-radius:14px}
.piece b{font-family:'Gowun Batang',serif;font-size:1.3rem;white-space:nowrap}
.piece small{display:block;font-size:.7rem;letter-spacing:.14em;color:var(--dim)}
.rhythm-box{margin-top:2.2rem;display:grid;grid-template-columns:1fr 1.3fr;gap:2.4rem;align-items:center}
.meter{font-family:'Gowun Batang',serif;font-size:4.5rem;line-height:1;color:var(--acc)}

.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:0 2.4rem}
.moves div{padding:1.1rem 0;border-top:1px solid var(--line2)}
.moves div b{display:block;font-size:1.2rem;margin-bottom:.2rem}
.moves div b i{font-style:normal;color:var(--acc);font-family:'Gowun Batang',serif;margin-right:.5rem}
.costume{display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:center;margin-top:2rem;padding:1.4rem 1.6rem;border:1px solid var(--line2);border-radius:18px}
.costume .sw{display:flex;gap:.35rem}
.costume .sw i{width:2.2rem;height:3.6rem;border-radius:8px;border:1px solid rgba(255,255,255,.2)}
.respect{margin-top:1.6rem;padding:1rem 1.4rem;border-radius:14px;background:rgba(201,115,74,.14);border:1px solid rgba(201,115,74,.5);font-size:.98rem}
.think{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:1rem 2.4rem}
.think p{margin:0;font-size:1.15rem;padding:.8rem 0 .8rem 1rem;border-left:3px solid var(--acc)}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:2.4rem 0 3rem}
.nextbar a{text-decoration:none}
.nextbar .big{font-family:'Gowun Batang',serif;font-size:2rem;display:block}

/* ---------- rhythm steps ---------- */
.steps{display:flex;gap:.4rem;align-items:flex-end;flex-wrap:nowrap}
.steps .st{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.steps .bar{width:100%;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:background .08s,transform .08s;display:grid;place-items:center;font-weight:900}
.steps .st[data-a="2"] .bar{height:7rem;background:color-mix(in srgb,var(--acc) 45%,transparent)}
.steps .st[data-a="1"] .bar{height:4.6rem;background:color-mix(in srgb,var(--acc) 22%,transparent)}
.steps .st[data-a="0"] .bar{height:2.6rem}
.steps .st[data-a="-1"] .bar{height:1.2rem;opacity:.35}
.steps .st.hit .bar{background:var(--acc);transform:scale(1.06);box-shadow:0 0 30px color-mix(in srgb,var(--acc) 70%,transparent);color:#111}
.steps .lab{font-size:.85rem;font-weight:700}
.steps .mv{font-size:.68rem;color:var(--muted);text-align:center;line-height:1.3;min-height:1.8em}
.steps .sep{width:2px;align-self:stretch;background:var(--line2);margin:0 .2rem;flex:none}
.steps.small .st[data-a="2"] .bar{height:3.6rem}.steps.small .st[data-a="1"] .bar{height:2.5rem}.steps.small .st[data-a="0"] .bar{height:1.5rem}.steps.small .st[data-a="-1"] .bar{height:.8rem}
.steps.small .mv{display:none}
.playbtn{display:inline-flex;align-items:center;gap:.55rem;border:0;border-radius:99px;padding:.55rem 1.2rem;background:var(--text);color:#111;font-weight:700}
.playbtn.on{background:var(--acc)}

/* ---------- lab ---------- */
.lab-tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.2rem 0 1.6rem}
.lab-tabs button{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:.45rem 1.1rem;font-size:.95rem;display:flex;align-items:center;gap:.5rem}
.lab-tabs button i{width:.7rem;height:.7rem;border-radius:50%;background:var(--c)}
.lab-tabs button.on{background:var(--text);color:#111;border-color:var(--text);font-weight:700}
.lab-stage{display:grid;grid-template-columns:1.55fr 1fr;gap:2.6rem;align-items:start}
.lab-main{background:var(--bg2);border-radius:24px;padding:2rem 2rem 1.6rem;border:1px solid var(--line)}
.lab-head{display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap;margin-bottom:1.6rem}
.lab-head .meter{font-size:3.6rem}
.lab-head h3{font-family:'Gowun Batang',serif;font-size:1.9rem}
.lab-count{font-family:'Gowun Batang',serif;font-size:3.4rem;text-align:center;min-height:4.6rem;color:var(--acc);margin-top:.6rem}
.ctrl{display:flex;flex-wrap:wrap;gap:1rem 1.6rem;align-items:center;margin-top:1.4rem;padding-top:1.2rem;border-top:1px solid var(--line)}
.ctrl label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:.6rem}
.ctrl input[type=range]{width:12rem;accent-color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:99px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.4rem 1rem;font-size:.85rem}
.seg button.on{background:var(--acc);color:#111;font-weight:700}
.clock{display:block;margin:0 auto;width:min(26rem,100%)}
.clock circle.n{fill:rgba(255,255,255,.07);stroke:var(--line2)}
.clock circle.n.a{fill:color-mix(in srgb,var(--acc) 40%,transparent);stroke:var(--acc)}
.clock circle.n.hit{fill:var(--acc)}
.clock text{fill:#fff;font-weight:700;font-size:20px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lab-side h4{font-size:.72rem;letter-spacing:.16em;color:var(--acc);margin:0 0 .4rem}
.lab-side p{margin:0 0 1.4rem;font-size:1.04rem}
.lab-side .body{font-size:1.15rem;font-family:'Gowun Batang',serif;border-left:4px solid var(--acc);padding-left:1rem}

/* ---------- compare ---------- */
.ctable-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px}
table.ct{border-collapse:collapse;width:100%;min-width:1200px;font-size:.88rem}
table.ct th,table.ct td{padding:.75rem .9rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.ct thead th{position:sticky;top:0;background:#1d1a27;font-size:.78rem;letter-spacing:.06em;cursor:pointer;white-space:nowrap}
table.ct thead th:hover{color:var(--acc)}
table.ct tbody th{white-space:nowrap;font-size:1rem}
table.ct tbody th a{text-decoration:none;display:flex;align-items:center;gap:.5rem}
table.ct tbody th a i{width:.6rem;height:.6rem;border-radius:50%;background:var(--c)}
table.ct tr.kr td,table.ct tr.kr th{background:rgba(255,255,255,.025)}
table.ct .hl{background:color-mix(in srgb,var(--acc) 16%,transparent)!important;color:#fff}
table.ct td.dim{opacity:.35}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:1.4rem;align-items:start}
.pair .vs{font-family:'Gowun Batang',serif;font-size:2.4rem;color:var(--dim);align-self:center}
.pick{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1rem}
.pick button{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:.25rem .8rem;font-size:.8rem}
.pick button.on{background:var(--c);border-color:var(--c);color:#111;font-weight:700}
.pcard{border-top:4px solid var(--c);padding-top:.8rem}
.pcard h3{font-family:'Gowun Batang',serif;font-size:2rem;margin-bottom:.6rem}
.pcard dl{margin:0;display:grid;grid-template-columns:7rem 1fr;gap:.55rem 1rem;font-size:.98rem}
.pcard dt{color:var(--dim);font-size:.8rem;padding-top:.15rem}
.pcard dd{margin:0}
.axis{margin:1.6rem 0 2.6rem}
.axis-head{display:flex;justify-content:space-between;font-size:1rem;font-weight:700;margin-bottom:.5rem}
.axis-head span:last-child{text-align:right}
.track{position:relative;height:6.6rem;border-radius:16px;background:linear-gradient(90deg,rgba(127,178,255,.16),rgba(232,176,74,.16));border:1px solid var(--line)}
.track::before{content:"";position:absolute;left:50%;top:10%;bottom:10%;border-left:1px dashed var(--line2)}
.chip{position:absolute;transform:translate(-50%,0);padding:.12rem .6rem;border-radius:99px;background:var(--c);color:#111;font-weight:700;font-size:.78rem;white-space:nowrap;cursor:grab;touch-action:none;user-select:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.chip:active{cursor:grabbing}
.vs-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid var(--line2)}
.vs-grid>div{padding:1.4rem 1.6rem 1.4rem 0}
.vs-grid>div+div{padding-left:1.6rem;border-left:1px solid var(--line)}
.vs-grid h3{font-family:'Gowun Batang',serif;font-size:1.5rem;margin-bottom:.8rem}
.vs-grid ul{margin:0;padding-left:1.1rem}
.vs-grid li{margin-bottom:.6rem}

/* ---------- quiz ---------- */
.quiz{max-width:1100px;margin:0 auto}
.qbar{display:flex;gap:.3rem;margin:1rem 0 2rem}
.qbar i{flex:1;height:.45rem;border-radius:99px;background:var(--line)}
.qbar i.ok{background:#4cc38a}.qbar i.no{background:#e5534b}.qbar i.cur{background:var(--acc)}
.qtype{font-size:.75rem;letter-spacing:.14em;color:var(--acc);font-weight:700}
.qtext{font-family:'Gowun Batang',serif;font-size:2.1rem;line-height:1.4;margin:.4rem 0 1.4rem}
.qmedia{margin:0 0 1.6rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.opts button{display:flex;gap:1rem;align-items:center;text-align:left;border:2px solid var(--line2);background:var(--bg2);border-radius:16px;padding:1rem 1.2rem;font-size:1.2rem;transition:border-color .15s,background .15s}
.opts button b{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:1rem}
.opts button:hover:not(:disabled){border-color:var(--acc)}
.opts button.ok{border-color:#4cc38a;background:rgba(76,195,138,.15)}
.opts button.no{border-color:#e5534b;background:rgba(229,83,75,.15)}
.opts button:disabled{cursor:default}
.explain{margin-top:1.4rem;padding:1.2rem 1.5rem;border-radius:16px;background:var(--bg2);border:1px solid var(--line2);font-size:1.1rem}
.explain b{display:block;font-size:1.3rem;margin-bottom:.3rem}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem}
.score{font-family:'Gowun Batang',serif;font-size:6rem;line-height:1;color:var(--acc)}
.review{list-style:none;padding:0;margin:1.6rem 0;display:grid;gap:.5rem}
.review li{display:grid;grid-template-columns:2rem 1fr;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--line);font-size:1rem}

.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.spin{animation:spin 24s linear infinite;transform-origin:800px 450px}
@keyframes spin{to{transform:rotate(360deg)}}
.draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 6s ease forwards infinite alternate}
@keyframes draw{to{stroke-dashoffset:0}}
.bob{animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-30px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1100px){
  :root{--side:270px}
  .home-hero,.watch,.two,.lab-stage,.plan,.rhythm-box{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .map-legend{grid-template-columns:1fr 1fr}
  .vs-grid{grid-template-columns:1fr}.vs-grid>div+div{border-left:0;padding-left:0;border-top:1px solid var(--line)}
}
@media (max-width:820px){
  #side{transform:translateX(-100%)} main{margin-left:0} #burger{display:block}
  body.side-open #side{transform:none}
  .wrap{padding:0 1.2rem}.d-hero .inner{padding:4rem 1.2rem 2rem}
  .d-hero h1{font-size:3.2rem}.home-hero h1{font-size:3rem}
  .pair{grid-template-columns:1fr}.pair .vs{display:none}
}

/* ---------- 다듬기 (v2) ---------- */
:root{--r:16px}
h2.sec{font-size:2rem;letter-spacing:-.01em;margin:.35rem 0 1.4rem}
.eyebrow{font-size:.7rem;letter-spacing:.2em}
#side{background:#0c0b12}
#nav a{position:relative;margin:1px 0}

.pager .where{gap:.7rem;min-width:16rem;justify-content:center}
.pager .pg{display:block;width:12rem;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.pager .pg i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.pager .where em{font-style:normal;font-size:.75rem;color:var(--dim);font-variant-numeric:tabular-nums}
.d-hero{min-height:62vh}
.d-hero h1{font-size:4.8rem}
.facts{background:rgba(10,9,15,.45);backdrop-filter:blur(6px);border-radius:12px;border:1px solid var(--line);padding:0 1.2rem;max-width:max-content}

.subnav button{border:0;background:transparent;color:var(--muted);padding:.35rem .8rem;border-radius:99px;font-size:.82rem;white-space:nowrap;display:flex;align-items:center;gap:.45rem}
.subnav button i{font-style:normal;font-size:.68rem;width:1.25rem;height:1.25rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--text)}
.subnav button:hover{background:rgba(255,255,255,.07);color:var(--text)}
.subnav .sp{flex:1}

section.blk{padding:3.2rem 0}

.ask{border:1px solid var(--line);border-left:5px solid var(--acc);background:rgba(255,255,255,.035);border-radius:var(--r);padding:1.1rem 1.5rem;margin-bottom:2.2rem}
.ask b{font-size:.7rem;letter-spacing:.18em}

.rv{margin-top:.7rem}

.rv summary::-webkit-details-marker{display:none}
.rv summary::before{content:"";width:.45rem;height:.45rem;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s;margin-right:.1rem}
.rv[open] summary::before{transform:rotate(45deg) translate(-1px,-1px)}
.rv summary:hover{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.rv .rv-c{display:none}.rv[open] .rv-l{display:none}.rv[open] .rv-c{display:inline}
.rv-body{margin-top:.6rem;padding:.85rem 1.1rem;border-radius:12px;background:color-mix(in srgb,var(--acc) 10%,rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--acc) 28%,transparent);font-size:1rem;line-height:1.7;color:var(--text);animation:fade .3s ease}
.watch{grid-template-columns:1.55fr 1fr;gap:2.6rem}
.points{margin-top:.6rem}
.points li{grid-template-columns:2.4rem 1fr;padding:.9rem 0;font-size:1.05rem}
.points li p{margin:0;line-height:1.6}
.points li:last-child{border-bottom:0}
.more-vids{margin-top:2.6rem;padding-top:1.8rem;border-top:1px dashed var(--line)}
.vid-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1.4rem;margin-top:.8rem}
.vid-frame{border-radius:var(--r)}
.vid figcaption{font-size:.8rem;line-height:1.55}
.vid figcaption b{font-weight:700}
.vid-frame .mode{backdrop-filter:blur(6px);font-size:.68rem;padding:.2rem .7rem}
.inst{border-top:0;gap:0 1.6rem}

.piece{border:1px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.03)}
.rhythm-box{align-items:start;margin-top:2.6rem}
.rhythm-box .rt{font-size:1.05rem;margin:.8rem 0 0;color:var(--muted)}
.rpanel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:1.4rem 1.4rem 1.2rem}
.rpanel .ask{margin:0;background:transparent;border:0;border-left:5px solid var(--acc);border-radius:0;padding:.2rem 0 .2rem 1.2rem}
.rbtns{display:flex;gap:.8rem;align-items:center;margin-top:1.1rem;flex-wrap:wrap}
.moves div{border-top:1px solid var(--line)}
.costume{border-color:var(--line);background:rgba(255,255,255,.025);border-radius:var(--r)}
.costume p{margin:.3rem 0 0;font-size:1.03rem}
.respect{border-radius:var(--r)}
.think{gap:1.2rem 2.4rem}
.tq{border-left:3px solid var(--acc);padding:.3rem 0 .3rem 1.1rem}
.think .tq p{margin:0;font-size:1.12rem;line-height:1.6;border:0;padding:0}
.nextbar small{display:block;color:var(--dim);font-size:.75rem}
.nextbar{border-top:1px solid var(--line);margin-top:1rem}
.lab-main,.ctable-wrap{border-radius:20px}

.home-hero h1{font-size:4.2rem}

/* ---------- v3: 수업 개선 ---------- */
.core3{display:grid;gap:.8rem;margin-top:.6rem}

details.more{border:1px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.02);margin-top:1rem}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.8rem;padding:1rem 1.4rem;font-size:1.12rem;font-weight:700}

details.more>summary small{font-weight:400;color:var(--dim);font-size:.82rem}
details.more>summary::after{content:"+";margin-left:auto;font-size:1.5rem;color:var(--acc);line-height:1;font-weight:400}

.exit{display:grid;gap:.8rem;margin-top:.4rem}
.exit .fr{font-family:'Gowun Batang',serif;font-size:1.35rem;line-height:1.9;padding:1rem 1.4rem;border-radius:var(--r);background:var(--bg2);border:1px solid var(--line)}
.exit .fr u{text-decoration:none;display:inline-block;min-width:6em;border-bottom:2px dashed var(--acc);margin:0 .25em;vertical-align:-.15em;height:1.2em}
.exit .fr b{color:var(--acc)}
.qmode{display:flex;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;margin-top:.7rem;font-size:.88rem;color:var(--muted)}
.scroll-hint{display:none;font-size:.82rem;color:var(--dim);margin:.6rem 0 0;text-align:center}
table.ct tbody th{position:sticky;left:0;z-index:2;background:#16141e}
table.ct tr.kr th{background:#1a1822}
table.ct thead th:first-child{left:0;z-index:4}
table.ct thead th:focus-visible{outline-offset:-3px}
.chip:focus-visible{outline:3px solid #fff;outline-offset:2px}
.mini.cls{border-color:var(--acc);color:var(--acc);font-weight:700}
.mini.cls.on{background:var(--acc);color:#111}
.pin .hit{fill:transparent;stroke:none}

.pin:hover .core,.pin:focus .core{r:12}
.map-legend a small{font-size:.85rem}
@media (max-width:1100px){.pair{grid-template-columns:1fr}.pair .vs{display:none}.scroll-hint{display:block}}
@media (max-width:820px){.d-hero h1{font-size:3.2rem}.home-hero h1{font-size:3rem}.core3 .cc p{font-size:1.08rem}.exit .fr{font-size:1.15rem}}

/* ---------- 학습지 허브판 (dance-class) ---------- */
body .cr-chip{left:auto;bottom:auto;right:12px;top:12px}
.qr{margin:1.6rem 0 0;border:1px solid var(--line2);border-radius:var(--r);background:rgba(255,255,255,.03)}
.qr>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.8rem;padding:.9rem 1.3rem;font-weight:700;flex-wrap:wrap}

.qr>summary small{font-weight:400;color:var(--dim);font-size:.8rem}

.qr[open]>summary::after{content:"−"}
.qr-body{display:flex;gap:1.6rem;align-items:center;flex-wrap:wrap;padding:.2rem 1.3rem 1.3rem}

#nav a.wsl{padding-left:2.1rem;font-size:.78rem;color:var(--dim)}

#nav a.wsl.on{color:var(--text)}
.bank{display:flex;flex-wrap:wrap;gap:.45rem;padding:1rem 1.2rem;border:1px dashed var(--line2);border-radius:var(--r);margin:1.6rem 0 1.4rem;background:rgba(255,255,255,.025)}
.bank b{width:100%;font-size:.7rem;letter-spacing:.16em;color:var(--dim)}
.bank span{padding:.12rem .8rem;border-radius:99px;border:1px solid var(--line2);font-size:.95rem;transition:opacity .2s}

.wsitems{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}

.fix{display:inline-block;font-size:.95rem;font-weight:700;color:#4cc38a;margin:0 .3rem}

<body>
<button id="burger" aria-label="메뉴 열기">☰ 메뉴</button>

  <div class="brand"><small>중학교 1학년 음악 · 2차시</small><b>춤을 세계 음악 속으로</b></div>
  <nav id="nav"></nav>
  <div class="tools">
    <div class="tool-row"><span>글자 크기</span><button class="mini" data-fs="-1" aria-label="글자 작게">가−</button><button class="mini" data-fs="1" aria-label="글자 크게">가+</button></div>
    <div class="tool-row" id="vmRow"><span>영상 재생</span><button class="mini" data-vm="link">유튜브 창</button><button class="mini" data-vm="embed">페이지 안</button></div>
    <div class="tool-row"><span>수업</span><button class="mini cls" id="classBtn">교실 모드 켜기</button></div>
    <div class="tool-row"><span>화면</span><button class="mini" id="fsBtn">전체 화면</button><button class="mini" id="hideSide">메뉴 숨기기</button></div>
  </div>
</aside>

  <div id="view"></div>
  <div class="pager"><button id="prev"></button><div class="where" id="where"></div><button id="next"></button></div>
</main>

<script>
/* =========================================================

/* 확인 코드: 학번·이름으로 잠근 점수 / 자리 비움 / 시도 횟수 (dance/ 학습지와 같은 방식) */
const B36=x=>x.toString(36).toUpperCase();
function makeCode(num,name,sc,away,att){
 const n=sc*10000+Math.min(away,99)*100+Math.min(att,99);
 const k=wsHash('k|'+num+'|'+name)&0xFFFFF;
 const v=(n^k)>>>0,chk=wsHash('c|'+num+'|'+name+'|'+n)%1296;
 return B36(v).padStart(4,'0')+'-'+B36(chk).padStart(2,'0');
}
function readCode(num,name,code){
 const m=String(code).toUpperCase().replace(/\s/g,'').match(/^([0-9A-Z]+)-([0-9A-Z]{2})$/);if(!m)return null;
 const k=wsHash('k|'+num+'|'+name)&0xFFFFF,n=(parseInt(m[1],36)^k)>>>0;
 if(wsHash('c|'+num+'|'+name+'|'+n)%1296!==parseInt(m[2],36))return null;
 return {sc:Math.floor(n/10000),away:Math.floor(n/100)%100,att:n%100};
}

   }
   this.timer=setTimeout(tick,25);
  };
  tick();
 },

function km(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b[1]-a[1]),dn=t(b[0]-a[0]);const h=Math.sin(dl/2)**2+Math.cos(t(a[1]))*Math.cos(t(b[1]))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h))/100)*100}

function bindLab(root){

 root.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{const was=!!AE.playing;AE.stop();labVar=b.dataset.var;labBpm=p.variants[labVar].bpm||null;render();if(was)document.getElementById('labPlay').click()});

 };

let cmpHL=null,pairA='waltz',pairB='chunaengjeon',axisState=null;

 if(!axisState)axisState=JSON.parse(JSON.stringify(AXES.map(a=>a.v)));
 const head=`<tr><th>춤</th>${CMP_COLS.map(([l,k])=>`<th data-col="${k}" tabindex="0" role="button" aria-pressed="${cmpHL===k}" class="${cmpHL===k?'hl':''}" title="눌러서 이 항목만 강조">${l}</th>`).join('')}</tr>`;

 const pick=(cur,side)=>`<div class="pick">${DANCES.map(d=>`<button data-pair="${side}" data-id="${d.id}" class="${d.id===cur?'on':''}" style="--c:${d.color}">${d.name}</button>`).join('')}</div>`;
 const card=id=>{const d=D[id];return `<div class="pcard" style="--c:${d.color}"><h3>${d.name}</h3><dl>${CMP_COLS.map(([l,k])=>`<dt>${l}</dt><dd>${esc(CMP[id][k])}</dd>`).join('')}</dl></div>`};
 const axes=AXES.map((a,ai)=>{
  const items=Object.entries(axisState[ai]).sort((x,y)=>x[1]-y[1]);
  const rowOf={};let lastX=[-99,-99,-99];
  items.forEach(([id,x])=>{let r=0;while(r<2&&x-lastX[r]<9)r++;rowOf[id]=r;lastX[r]=x;});
  return `<div class="axis"><div class="axis-head"><span>← ${a.l}</span><span>${a.r} →</span></div><div class="track" data-axis="${ai}">${items.map(([id,x])=>`<span class="chip" data-id="${id}" tabindex="0" role="slider" aria-label="${D[id].name} — ${a.l} ↔ ${a.r}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${x}" style="left:${x}%;top:${.55+rowOf[id]*1.95}rem;--c:${D[id].color}">${D[id].name}</span>`).join('')}</div></div>`;
 }).join('');
 return `<div class="wrap fade" style="padding-top:2.6rem;padding-bottom:2.4rem">
  <div class="eyebrow">04 · 세계의 춤 비교</div>
  <h2 class="sec" style="margin-bottom:.4rem">같은 "춤", 다른 세계</h2>

  </section>
  <section class="blk">
   <div class="eyebrow">생각 스펙트럼</div><h2 class="sec">우리 반의 생각으로 다시 배치해 보세요</h2>

    <div class="fr"><b>${D[pairA].name}</b>${josa(D[pairA].name,'과','와')} <b>${D[pairB].name}</b>${josa(D[pairB].name,'은','는')} <u></u>이(가) 비슷하지만, <u></u>이(가) 달라요.</div>
    <div class="fr">내가 직접 춰 보고 싶은 춤은 <u></u>(이)에요. 왜냐하면 <u></u> 때문이에요.</div>
   </div>
  </section>
 </div>`;

function josa(w,withB,noB){const c=w.charCodeAt(w.length-1);return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?withB:noB}
function bindCompare(root){
 root.querySelectorAll('th[data-col]').forEach(th=>{th.onclick=()=>{cmpHL=cmpHL===th.dataset.col?null:th.dataset.col;render(true)};th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();th.onclick()}}});
 root.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{if(b.dataset.pair==='a')pairA=b.dataset.id;else pairB=b.dataset.id;render(true)});
 root.querySelector('#axisReset').onclick=()=>{axisState=null;render(true)};
 root.querySelectorAll('.track').forEach(tr=>{
  const ai=+tr.dataset.axis;
  tr.querySelectorAll('.chip').forEach(ch=>{
   ch.onpointerdown=e=>{e.preventDefault();ch.setPointerCapture(e.pointerId);
    const move=ev=>{const r=tr.getBoundingClientRect();let x=(ev.clientX-r.left)/r.width*100;x=Math.max(3,Math.min(97,x));ch.style.left=x+'%';axisState[ai][ch.dataset.id]=Math.round(x)};
    ch.onpointermove=move;ch.onpointerup=()=>{ch.onpointermove=null;ch.onpointerup=null};};
   ch.onkeydown=e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();e.stopPropagation();let x=(axisState[ai][ch.dataset.id]||50)+(e.key==='ArrowRight'?4:-4);x=Math.max(3,Math.min(97,x));axisState[ai][ch.dataset.id]=x;ch.style.left=x+'%';ch.setAttribute('aria-valuenow',x)};
  });
 });
}

 {t:'비교',core:1,q:'처용무의 반주 음악 「수제천」의 리듬 특징으로 알맞은 것은?',o:['빠르고 일정한 4박','긴-짧은 스윙 리듬','매우 느리고, 호흡에 따라 박이 불규칙하다','12박 콤파스'],a:2,e:'수제천은 박을 일정하게 세기 어려울 만큼 느리고, 연주자들이 호흡을 맞추며 흘러가요. 메트로놈 같은 서양 춤곡의 박과 크게 달라요.'},
 {t:'문화',q:'하카 「카 마테」에 대한 설명으로 알맞은 것은?',o:['럭비 선수들이 경기를 위해 처음 만들었다','적에게 쫓기다 살아남은 기쁨을 담은 마오리의 하카다','스페인에서 전해진 춤이다','결혼식에서만 추는 춤이다'],a:1,e:'1820년 무렵 응아티 토아 부족의 지도자 테 라우파라하가 지었다고 전해져요. 하카는 환영, 추모, 축하 등 여러 자리에서 해요.'}
];
let qMode='core',qAns=STUDENT?ST.quiz.slice():[],qi=0;
function firstOpen(){const n=coreQ().length;for(let i=0;i<n;i++)if(qAns[i]==null)return i;return n}
qi=firstOpen();
const QL=()=>qMode==='core'?QUIZ.filter(q=>q.core):QUIZ;
const qModeHTML=()=>`<div class="qmode"><div class="seg"><button data-qm="core" class="${qMode==='core'?'on':''}">수업용 ${QUIZ.filter(q=>q.core).length}문항</button><button data-qm="all" class="${qMode==='all'?'on':''}">복습용 전체 ${QUIZ.length}문항</button></div><span>${qMode==='core'?'수업용은 듣고 보고 답하는 문제예요.':'외워야 하는 문제도 있어요. 집에서 복습할 때 풀어 보세요.'}</span></div>`;
function pageQuiz(){
 const QS=QL();
 if(qi>=QS.length){
  const sc=qAns.filter((a,i)=>a===QS[i].a).length;
  return `<div class="wrap fade" style="padding:2.6rem 3.2rem"><div class="quiz">
   <div class="eyebrow">05 · 종합 퀴즈 · 결과</div>
   <div style="display:flex;align-items:flex-end;gap:1.4rem;margin:1rem 0"><span class="score">${sc}</span><span style="font-size:1.6rem;color:var(--muted);padding-bottom:.6rem">/ ${QS.length}</span></div>
   <p class="lead">${sc>=Math.ceil(QS.length*.85)?'춤과 음악의 세계 여행을 완벽하게 마쳤어요!':sc>=Math.ceil(QS.length*.6)?'훌륭해요! 틀린 문제의 해설을 다시 확인해 볼까요?':'틀린 문제의 춤 페이지를 다시 둘러보고 도전해 봐요.'}</p>
   <ol class="review">${QS.map((q,i)=>`<li><b style="color:${qAns[i]===q.a?'#4cc38a':'#e5534b'}">${qAns[i]===q.a?'○':'✕'}</b><span>${esc(q.q)} — <b>${esc(q.o[q.a])}</b></span></li>`).join('')}</ol>
   <div style="display:flex;gap:.8rem;flex-wrap:wrap">${STUDENT&&qMode==='core'&&!ST.submitted?'<a class="btn" href="#submit">제출하러 가기 →</a>':'<button class="btn" id="qRestart">다시 풀기</button>'}${qMode==='core'?`<button class="btn ghost" data-qm="all">복습용 전체 ${QUIZ.length}문항 풀기</button>`:''}</div>
   <div class="ask" style="margin-top:2rem"><b>마무리</b><p>"세계의 춤 비교" 페이지 맨 아래 <b style="display:inline;font-size:inherit;letter-spacing:0">출구 카드</b>로 오늘 배운 것을 한 문장으로 써 보세요.</p></div>
  </div></div>`;
 }
 const q=QS[qi],ans=qAns[qi];
 let media='';
 if(q.audio)media=`<div class="qmedia">${(P[q.audio[0]].clock)?'':''}${stepsHTML({...P[q.audio[0]],color:'#e8b04a'},q.audio[1],true).replace(/<div class="lab">[^<]*<\/div>/g,'<div class="lab">?</div>')}<div style="margin-top:1rem"><button class="playbtn" id="qPlay">▶ 소리 듣기</button></div></div>`;
 if(q.video)media=`<div class="qmedia" style="max-width:760px">${videoHTML({id:q.video[0],title:'영상을 보고 답해 보세요',src:'',note:'',start:q.video[2],end:q.video[3]},q.video[1],true)}</div>`;
 return `<div class="wrap fade" style="padding:2.6rem 3.2rem 2.4rem"><div class="quiz">
  <div class="eyebrow">05 · 종합 퀴즈</div>${qModeHTML()}
  <div class="qbar">${QS.map((x,i)=>`<i class="${i===qi?'cur':qAns[i]==null?'':qAns[i]===x.a?'ok':'no'}"></i>`).join('')}</div>
  <div class="qtype">${qi+1} / ${QS.length} · ${q.t}</div>
  <div class="qtext">${esc(q.q)}</div>
  ${media}
  <div class="opts">${q.o.map((o,i)=>`<button data-o="${i}" ${ans!=null?'disabled':''} class="${ans!=null?(i===q.a?'ok':i===ans?'no':''):''}"><b>${'ABCD'[i]}</b>${esc(o)}</button>`).join('')}</div>
  ${ans!=null?`<div class="explain fade"><b style="color:${ans===q.a?'#4cc38a':'#e5534b'}">${ans===q.a?'정답이에요!':'아쉬워요. 정답은 '+'ABCD'[q.a]+'.'}</b>${esc(q.e)}</div>`:''}
  <div class="qnav"><button class="btn ghost" id="qPrev" ${qi===0?'disabled style="opacity:.3"':''}>← 이전 문제</button><button class="btn" id="qNext" ${ans==null?'disabled style="opacity:.35"':''}>${qi===QS.length-1?'결과 보기':'다음 문제 →'}</button></div>
 </div></div>`;
}
function bindQuiz(root){
 const QS=QL();
 root.querySelectorAll('[data-qm]').forEach(b=>b.onclick=()=>{if(qMode===b.dataset.qm)return;AE.stop();qMode=b.dataset.qm;qAns=qMode==='core'&&STUDENT?ST.quiz.slice():[];qi=qMode==='core'?firstOpen():0;render(true)});
 const r=root.querySelector('#qRestart');if(r)r.onclick=()=>{qi=0;qAns=[];render(true)};if(qi>=QS.length)return;
 const q=QS[qi];
 root.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{AE.stop();qAns[qi]=+b.dataset.o;if(qMode==='core'&&STUDENT&&!ST.submitted){ST.quiz=qAns.slice();saveST()}render(true)});
 const pl=root.querySelector('#qPlay');
 if(pl)pl.onclick=()=>{if(AE.playing){AE.stop();return}const p=P[q.audio[0]];AE.start(p,q.audio[1],p.variants[q.audio[1]].bpm||p.bpm,i=>highlight(root,p.id,i),q.audio[2]);pl.classList.add('on');pl.innerHTML='■ 멈춤';AE.onStopCb=()=>{pl.classList.remove('on');pl.innerHTML='▶ 다시 듣기'}};
 root.querySelector('#qPrev').onclick=()=>{if(qi>0){AE.stop();qi--;render(true)}};
 root.querySelector('#qNext').onclick=()=>{if(qAns[qi]!=null){AE.stop();qi++;render(true)}};
}

/* =========================================================
   라우터 / 네비게이션
   ========================================================= */
function buildNav(){
 let h='';
 const num=t=>`<b style="color:var(--dim);font-size:.75rem;width:1.4rem;flex:none">${t}</b>`;
 ROUTES.forEach(r=>{
  if(!r.grp){h+=`<a href="#${r.id}" data-r="${r.id}">${num('▶')}${r.label}</a>`;return}
  if(r.grp!=='02'){h+=`<a href="#${r.id}" data-r="${r.id}">${num(r.grp)}${GRP[r.grp]}</a>`;return}
  if(r.ws){h+=`<a class="sub wsl" href="#${r.id}" data-r="${r.id}" style="--c:${r.ws.color}"><span class="pen">✎</span>학습지</a>`;return}
  if(r.dance.id==='tango')h+=`<div class="grp" style="margin-left:.7rem">${num('02')}춤의 세계 탐험</div><div class="lesson">1차시 · 세계의 춤</div>`;
  if(r.dance.id==='salpuri')h+=`<div class="lesson">2차시 · 한국의 춤</div>`;
  h+=`<a class="sub" href="#${r.id}" data-r="${r.id}" style="--c:${r.dance.color}"><span class="dot"></span>${r.label}</a>`;
 });
 document.getElementById('nav').innerHTML=h;
}
function cur(){const h=(location.hash||'#home').slice(1);return ROUTES.find(r=>r.id===h)?h:'home'}
let lastRoute=null;
function render(keepScroll){
 const id=cur(),view=document.getElementById('view');
 if(id!==lastRoute){AE.stop();}
 const y=window.scrollY;
 const r=ROUTES.find(x=>x.id===id);
 let html='';
 if(id==='home')html=pageHome();
 else if(id==='map')html=pageMap();
 else if(r.dance)html=pageDance(r.dance);
 else if(r.ws)html=pageWS(r.ws);
 else if(id==='submit')html=pageSubmit();
 else if(id==='rhythm-lab')html=pageLab();
 else if(id==='compare')html=pageCompare();
 else if(id==='quiz')html=pageQuiz();
 view.innerHTML=html;
 document.documentElement.style.setProperty('--acc',(r.dance||r.ws)?(r.dance||r.ws).color:id==='rhythm-lab'?P[labSel].color:'#e8b04a');
 // 공통 바인딩
 view.querySelectorAll('[data-go]').forEach(g=>{const go=()=>location.hash=g.dataset.go;g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
 view.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.jump);if(t)window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-70,behavior:'smooth'})});
 view.querySelectorAll('[data-allans]').forEach(b=>b.onclick=()=>{const ds=[...view.querySelectorAll('details.rv')];const open=!ds.every(x=>x.open);ds.forEach(x=>{x.open=open;const m=x.closest('details.more');if(m&&open)m.open=true});b.textContent=open?'모든 답 접기':'모든 답 펼치기'});
 view.querySelectorAll('[data-lab]').forEach(a=>a.addEventListener('click',()=>{labSel=a.dataset.lab;labVar=null;labBpm=null}));
 view.querySelectorAll('.playbtn[data-play]').forEach(b=>b.onclick=()=>{
  if(AE.playing){const same=AE.playing.preset===b.dataset.play;AE.stop();if(same)return}
  const p=P[b.dataset.play],vk=b.dataset.v;
  AE.start(p,vk,p.variants[vk].bpm||p.bpm,i=>highlight(view,p.id,i));b.classList.add('on');b.innerHTML='■ 멈춤';
 });
 if(id==='rhythm-lab')bindLab(view);
 if(id==='compare')bindCompare(view);
 if(id==='quiz')bindQuiz(view);
 if(r.ws)bindWS(view);
 if(id==='submit')bindSubmit(view);
 if(id==='home')bindHome(view);
 if(id!=='submit'){sureSubmit=false;sureNext=false}
 // 내비 상태
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===id));
 const i=ROUTES.findIndex(x=>x.id===id),pv=ROUTES[i-1],nx=ROUTES[i+1];
 const pb=document.getElementById('prev'),nb=document.getElementById('next');
 pb.disabled=!pv;nb.disabled=!nx;
 pb.innerHTML=pv?`<small>← 이전</small><b>${pv.grp&&pv.grp!=='02'?GRP[pv.grp]:pv.label}</b>`:'<small>&nbsp;</small><b>&nbsp;</b>';
 nb.innerHTML=nx?`<small>다음 →</small><b>${nx.grp&&nx.grp!=='02'?GRP[nx.grp]:nx.label}</b>`:'<small>&nbsp;</small><b>&nbsp;</b>';
 document.getElementById('where').innerHTML=`<span class="pg"><i style="width:${(i+1)/ROUTES.length*100}%"></i></span><em>${i+1} / ${ROUTES.length}</em>`;
 document.querySelectorAll('[data-vm]').forEach(b=>b.classList.toggle('on',b.dataset.vm===videoMode));
 if(keepScroll)window.scrollTo(0,y);else if(id!==lastRoute)window.scrollTo(0,0);
 lastRoute=id;
 document.body.classList.remove('side-open');
 document.title=(r.id==='home'?'':(r.grp&&r.grp!=='02'?GRP[r.grp]:r.label)+' · ')+'춤을 세계 음악 속으로';
}
function go(dir){const i=ROUTES.findIndex(x=>x.id===cur()),n=ROUTES[i+dir];if(n)location.hash=n.id}
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
window.addEventListener('hashchange',()=>render());
document.addEventListener('keydown',e=>{
 if(e.target.closest('input,textarea,select,.chip'))return;
 if(e.key==='ArrowRight'&&!e.altKey)go(1);
 if(e.key==='ArrowLeft'&&!e.altKey)go(-1);
});
document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{fs=Math.max(16,Math.min(30,fs+(+b.dataset.fs)*2));document.documentElement.style.setProperty('--fs',fs+'px');store.set('fs',fs)});
document.querySelectorAll('[data-vm]').forEach(b=>{
 if(b.dataset.vm==='embed'&&!CAN_EMBED){b.disabled=true;b.style.opacity=.35;b.title='이 화면(앱 미리보기·내려받은 파일)에서는 유튜브가 페이지 안 재생을 막아요. 웹 주소에 올리면 쓸 수 있어요.';}
 b.onclick=()=>{if(b.dataset.vm==='embed'&&!CAN_EMBED)return;videoMode=b.dataset.vm;store.set('vm',videoMode);render(true)};
});
document.getElementById('fsBtn').onclick=()=>{try{const el=document.documentElement;if(!document.fullscreenElement){const p=el.requestFullscreen&&el.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}else document.exitFullscreen();}catch(e){}};
let classOn=false,fsBefore=null;
function setClass(on){classOn=on;const b=document.getElementById('classBtn');
 if(on){fsBefore=fs;fs=Math.max(fs,26);document.body.classList.add('side-closed');try{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen){const p=el.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}catch(e){}}
 else{if(fsBefore!=null)fs=fsBefore;document.body.classList.remove('side-closed');try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
 document.documentElement.style.setProperty('--fs',fs+'px');b.classList.toggle('on',on);b.textContent=on?'교실 모드 끄기':'교실 모드 켜기'}
document.getElementById('classBtn').onclick=()=>setClass(!classOn);
document.getElementById('hideSide').onclick=()=>document.body.classList.add('side-closed');
document.getElementById('burger').onclick=()=>{if(document.body.classList.contains('side-closed'))document.body.classList.remove('side-closed');else document.body.classList.toggle('side-open')};
if(STUDENT){const vr=document.getElementById('vmRow');if(vr)vr.style.display='none'}
buildNav();render();
</script>
</body>
</html>
